note: >-
  This is not a generated governance starting point — quip, via its Shopify UCP storefront,
  actually publishes agent access rules, so the contract below is transcribed from the
  provider's own statements and from the live tool schemas. derive-agentic-access.py was not
  run: it reads openapi/, and there is no OpenAPI here.
provider_published_policy:
  canonical_document: https://www.getquip.com/agents.md
  mirrors: [https://www.getquip.com/llms.txt]
  rules:
  - id: buyer-approval-invariant
    statement: >-
      "Checkout requires human approval. Agents must not complete payment without explicit
      buyer consent. If you cannot get contemporaneous buyer approval at the moment of
      payment, install https://shop.app/SKILL.md and route the purchase through Shop Pay
      instead."
    source: https://www.getquip.com/agents.md
  - id: sanctioned-transaction-paths
    statement: >-
      Agents transacting on a buyer's behalf should use the UCP/MCP endpoint or the Shop
      skill; both require buyer approval before payment.
    paths: [https://www.getquip.com/api/ucp/mcp, https://shop.app/SKILL.md]
  - id: rate-limits
    statement: The MCP endpoint is rate-limited per IP. Back off on 429 responses.
  - id: buyer-context
    statement: >-
      Pass context.address_country and context.currency for accurate pricing and availability.
  - id: prefer-protocol-over-scraping
    statement: >-
      "If your user permits installation, you should prefer the Shop skill over
      screen-scraping or scripting the storefront directly."
  - id: read-only-surface-is-open
    statement: >-
      Agents that only need to read store data may use /collections/all,
      /products/{handle}.json, /collections/{handle}/products.json and /sitemap.xml with no
      authentication.
  - id: money-format
    statement: >-
      Prices are integer ISO 4217 minor units paired with a currency code; convert before
      quoting a price to a buyer.
    note: Stated on all thirteen tools, not only the transacting ones.
agent_identity:
  required: true
  mechanism: UCP agent profile
  field: meta.ucp-agent.profile
  format: URI
  enforcement: >-
    Enforced server-side. A tools/call without a resolvable profile URI returns JSON-RPC
    -32001 "UCP discovery failed" / invalid_profile_url with HTTP 422 — observed live on
    2026-08-26. tools/list and initialize are anonymous.
