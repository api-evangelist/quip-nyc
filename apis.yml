apis:
- aid: quip-nyc-ucp-commerce-mcp
  name: quip UCP Commerce MCP API
  description: >-
    An anonymous Model Context Protocol endpoint implementing the Universal Commerce Protocol
    (UCP) shopping service for the quip online store. Exposes thirteen tools covering catalog
    search and lookup, product detail, cart lifecycle, checkout lifecycle and order retrieval,
    each carrying a full JSON Schema 2020-12 input contract. tools/list and initialize are
    anonymous; every tools/call requires a resolvable UCP agent profile URI. Checkout
    completion requires contemporaneous human buyer approval per the store's published agent
    rules, and no API-level reversal of a completed checkout exists.
  humanURL: https://www.getquip.com/agents.md
  baseURL: https://www.getquip.com/api/ucp/mcp
  tags:
  - MCP
  - Agentic Commerce
  - Commerce
  - Checkout
  - Catalog
  properties:
  - type: MCPServer
    url: mcp/quip-nyc-mcp.yml
  - type: ToolCrosswalk
    url: mcp/quip-nyc-tool-crosswalk.yml
- aid: quip-nyc-storefront-graphql
  name: quip Storefront GraphQL API
  description: >-
    The Shopify Storefront GraphQL API as deployed on the quip domain, version 2026-07. Schema
    introspection is open to anonymous callers and returns 415 types, 34 query root fields and
    41 mutations covering products, variants, collections, selling plans, blogs, pages, search,
    cart and customer accounts. Responses carry an extensions.cost query-cost object. Fifty-two
    fields are marked @deprecated in the schema.
  humanURL: https://shopify.dev/docs/api/storefront
  baseURL: https://www.getquip.com/api/2026-07/graphql.json
  tags:
  - GraphQL
  - Commerce
  - Catalog
  - Cart
  properties:
  - type: GraphQL
    url: graphql/quip-nyc-storefront.graphql
- aid: quip-nyc-storefront-json
  name: quip Storefront JSON Endpoints
  description: >-
    The read-only JSON surface the store documents for agents that only need to browse catalog
    data without transacting — product JSON by handle, collection product listings, product
    search and the sitemap. No authentication is required; verified live at
    /products.json and /collections/all/products.json.
  humanURL: https://www.getquip.com/agents.md
  baseURL: https://www.getquip.com/
  tags:
  - JSON
  - Catalog
  - Read Only
  properties:
  - type: JSONLD
    url: json-ld/quip-nyc-product.jsonld
