aid: quip-nyc
name: Quip NYC
description: >-
  quip NYC Inc. is a Brooklyn, New York oral care company founded in 2015 by Simon Enever and
  Bill May, selling dentist-designed electric toothbrushes, water flossers, refillable floss,
  toothpaste, mouthwash and whitening products direct to consumers on a recurring refill
  subscription. It has raised roughly $272M across its rounds and serves millions of
  subscribers. quip publishes no developer portal, API reference, OpenAPI specification or
  SDK of its own. Its entire machine-readable surface is its storefront: a Shopify-hosted
  commerce platform that serves agent-facing instructions at /agents.md and /llms.txt, a
  Universal Commerce Protocol merchant profile at /.well-known/ucp, an anonymous Model
  Context Protocol endpoint exposing thirteen catalog, cart, checkout and order tools, an
  openly introspectable Storefront GraphQL API, and a documented unauthenticated product
  JSON surface. The company's published agent policy requires contemporaneous human approval
  before any agent completes a payment.
