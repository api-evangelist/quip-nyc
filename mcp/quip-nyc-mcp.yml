tools_manifest:
  file: quip-nyc-tools-list.json
  method: probed
  source: 'POST https://www.getquip.com/api/ucp/mcp {"jsonrpc":"2.0","id":1,"method":"tools/list"}'
  http_status: 200
  note: >-
    Saved verbatim. Every tool carries a full JSON Schema inputSchema (draft 2020-12) —
    anonymous introspection is open, so no auth-gated fallback was needed.
tools:
- name: search_catalog
  category: catalog
  description: >-
    Search products from the online store using natural-language queries, filter criteria,
    or both. At least one of query or filters is required. Paginated via pagination.cursor.
    Response conforms to dev.ucp.shopping.catalog.search.
  required: [meta, catalog]
- name: lookup_catalog
  category: catalog
  description: Look up products or variants by identifier. Conforms to dev.ucp.shopping.catalog.lookup.
  required: [meta, catalog]
- name: get_product
  category: catalog
  description: Retrieve complete product detail by identifier.
  required: [meta, catalog]
- name: create_cart
  category: cart
  description: Creates a new cart and returns a server-assigned cart id.
  required: [meta, cart]
- name: get_cart
  category: cart
  description: Get the cart contents, line items and totals.
  required: [meta, id]
- name: update_cart
  category: cart
  description: Perform updates to a cart.
  required: [meta, cart, id]
- name: cancel_cart
  category: cart
  description: Cancels a cart.
  required: [meta, id]
  reversal_of: create_cart
- name: create_checkout
  category: checkout
  description: Creates a checkout. Returns line items, totals, discounts and taxes.
  required: [meta, checkout]
- name: get_checkout
  category: checkout
  description: Returns checkout details including line items, totals, discounts and taxes.
  required: [meta, id]
- name: update_checkout
  category: checkout
  description: Updates a checkout — used to set the shipping address and delivery method.
  required: [meta, checkout, id]
- name: complete_checkout
  category: checkout
  description: >-
    Completes a checkout and returns the result, including order ID and Thank You Page URL.
    quip's published agent rules require explicit contemporaneous human buyer approval of payment.
  required: [meta, id, checkout]
  human_approval_required: true
- name: cancel_checkout
  category: checkout
  description: Cancels a checkout.
  required: [meta, id]
  reversal_of: create_checkout
- name: get_order
  category: order
  description: Get the details of an order.
  required: [meta, id]
coverage:
  tools_total: 13
