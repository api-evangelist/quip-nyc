agent_identity:
  mechanism: UCP agent profile
  location: meta.ucp-agent.profile — a required object on all thirteen tool input schemas
  enforced: true
  observed: >-
    A tools/call without meta.ucp-agent.profile returns HTTP 422 with JSON-RPC error
    -32001 "UCP discovery failed" / data.code invalid_profile_url. The store requires
    an agent to identify itself with a resolvable profile URI before any catalog, cart
    or checkout call succeeds.
