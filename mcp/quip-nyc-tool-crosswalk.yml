note: >-
  quip publishes no OpenAPI, so this crosswalk binds each UCP/MCP tool to the Storefront
  GraphQL field(s) and to the documented storefront JSON endpoints instead of to
  operationIds. Every GraphQL field named below was verified verbatim in the introspected
  2026-07 schema; every tool name was verified in the live tools/list response. Bindings
  are semantic — Shopify does not publish a tool-to-field mapping — so confidence is
  recorded honestly and no binding is asserted as exact.
surfaces:
  openapi: null
  openapi_note: >-
    No OpenAPI or Swagger document is published on any quip host. Probed
    www.getquip.com/openapi.json (404), api.getquip.com/openapi.json (404),
    bb73c3-5.myshopify.com/openapi.json (404); developer.getquip.com,
    developers.getquip.com and docs.getquip.com do not resolve. /api-docs, /swagger.json,
    /api/openapi.json, /asyncapi.yaml and /.well-known/asyncapi.yaml all 404. /?wsdl returns
    200 but the body is the Shopify storefront HTML, not a SOAP contract, and buf.build/getquip
    returns 200 for a nonexistent org too (control probe confirmed), so neither is a hit.
    NAMESAKE WARNING: a web search for "quip API documentation" returns quip.com/api/reference,
    the Quip Automation API — that is Salesforce's Quip document-collaboration product, a
    DIFFERENT COMPANY. Nothing from quip.com belongs in this repo; quip NYC Inc. is the oral
    care company at getquip.com and publishes no such API.
